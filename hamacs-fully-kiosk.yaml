button_card_templates:
  badge_avatar_navigate:
    variables:
      member: ''
      selector: ''
    entity: '[[[ return "person." + variables.member; ]]]'
    show_icon: false
    show_name: false
    show_state: false
    custom_fields:
      badge:
        card:
          type: custom:button-card
          entity: '[[[ return entity.entity_id; ]]]'
          update_timer: 30s
          show_icon: true
          show_name: false
          icon: |
            [[[
              const location = states[entity.entity_id].state;
              if (location === 'home') {
                return 'mdi:home';
              }

              const zones = states['sensor.zones_icon']?.attributes.data;
              return zones ? (zones[location] || 'mdi:home-off') : 'mdi:progress-question';
            ]]]
          styles:
            card:
              - position: absolute
              - top: calc(80px - 17px - 5px - 6px)
              - left: calc(80px - (17px * 2) - 2px)
              - width: 24px
              - height: 24px
              - background: black
              - border-radius: 100%
            icon:
              - width: 18px
              - color: white
          tap_action:
            action: perform-action
            perform_action: input_select.select_option
            target:
              entity_id: '[[[ return variables.selector; ]]]'
            data:
              option: '[[[ return variables.member; ]]]'
    styles:
      card:
        - padding: 0
        - height: 80px
        - background-image: >
            [[[ return 'url(/local/images/avatars/mini/' + variables.member +
            '_inactive.jpg)'; ]]]
        - background-size: contain
        - background-repeat: no-repeat
        - background-position: center
        - transition: background-image 350ms ease-in-out
        - '--ha-ripple-hover-opacity': 0
        - '--ha-ripple-pressed-opacity': 0
      icon:
        - width: 80px
        - height: 80px
      custom_fields:
        badge:
          - position: absolute
          - top: 1px
          - left: 0
          - right: 0
          - margin: 0 auto
          - width: 55px
          - font-size: 12px
    extra_styles: |
      @keyframes pulse {
        from { opacity: 1; }
        to { opacity: 0.8; }
      }
    state:
      - operator: template
        value: |
          [[[ return states[variables.selector].state === variables.member; ]]]
        styles:
          card:
            - background-image: >
                [[[ return 'url(/local/images/avatars/mini/' + variables.member
                + '_active.jpg)'; ]]]
            - animation: pulse 2s infinite alternate linear
    tap_action:
      action: perform-action
      perform_action: input_select.select_option
      target:
        entity_id: '[[[ return variables.selector ]]]'
      data:
        option: '[[[ return variables.member; ]]]'
  badge_person_navigate:
    variables:
      person: ''
      member: ''
      color: white
      selector: ''
      condition: '[[[ return states[variables.selector].state === variables.member; ]]]'
    entity: '[[[ return variables.person ]]]'
    show_name: false
    show_state: false
    show_entity_picture: true
    custom_fields:
      badge:
        card:
          type: custom:button-card
          entity: '[[[ return entity.entity_id; ]]]'
          update_timer: 30s
          show_icon: true
          show_name: false
          icon: |
            [[[
              const location = states[entity.entity_id].state;
              if (location === 'home') {
                return 'mdi:home';
              }

              const zones = states['sensor.zones_icon']?.attributes.data;
              return zones ? (zones[location] || 'mdi:home-off') : 'mdi:progress-question';
            ]]]
          styles:
            card:
              - position: absolute
              - left: calc(55px - 10px)
              - width: 17px
              - height: 17px
              - background: |
                  [[[ return variables.condition ? variables.color : 'none'; ]]]
              - border-radius: 100%
              - outline: >
                  [[[ return variables.condition ? 'none' : '2px solid white';
                  ]]]
              - box-shadow: none
            icon:
              - width: 14px
              - color: |
                  [[[ return variables.condition ? 'black' : 'white'; ]]]
          tap_action:
            action: perform-action
            perform_action: input_select.select_option
            target:
              entity_id: '[[[ return variables.selector ]]]'
            data:
              option: '[[[ return variables.member; ]]]'
    styles:
      card:
        - overflow: visible
        - padding: 0
        - height: 55px
        - border-radius: 0
        - '--ha-ripple-hover-opacity': 0
        - '--ha-ripple-pressed-opacity': 0
      img_cell:
        - width: 55px
        - height: 55px
        - border-radius: 100%
        - outline: |
            [[[
              return variables.condition ? "3px solid " + variables.color : "none";
            ]]]
        - box-shadow: |
            [[[
              return variables.condition ? variables.color + " 0px 0px 8px 0px" : "none";
            ]]]
      entity_picture:
        - width: 100%
        - height: 100%
      custom_fields:
        badge:
          - position: absolute
          - top: 1px
          - left: 0
          - right: 0
          - margin: 0 auto
          - width: 55px
          - font-size: 12px
          - color: red
    tap_action:
      action: perform-action
      perform_action: input_select.select_option
      target:
        entity_id: '[[[ return variables.selector ]]]'
      data:
        option: '[[[ return variables.member; ]]]'
  remote_button:
    variables:
      entity: ''
      command: ''
    tap_action:
      action: call-service
      service: remote.send_command
      service_data:
        entity_id: '[[[ return variables.entity ]]]'
        command: '[[[ return variables.command ]]]'
    aspect_ratio: 1/1
    styles:
      card:
        - background: rgba(255, 255, 255, 0.05)
        - border-radius: 4px
        - border: none
      icon:
        - color: gray
        - width: 30%
    card_mod:
      style: |
        ha-card, ha-card::before {
          border: none;
          border-radius: 2px;
          box-shadow: none;
          background: rgba(40, 40, 45, .5);
          backdrop-filter: none;
        }
  remote_app_button:
    template: remote_button
    variables:
      entity: ''
      app: ''
      color: ''
      background: ''
    tap_action:
      action: call-service
      service: media_player.select_source
      target:
        entity_id: '[[[ return variables.entity ]]]'
      data:
        source: '[[[ return variables.app ]]]'
    styles:
      card:
        - background: '[[[ return variables.background ]]]'
        - border-radius: 10px
      icon:
        - color: '[[[ return variables.color ]]]'
  remote_button_center:
    template: remote_button
    styles:
      card:
        - background: rgba(255, 255, 255, 0.1)
      icon:
        - color: white
views:
  - type: panel
    path: home
    title: M.A.C.S.
    icon: mdi:tablet-dashboard
    cards:
      - type: vertical-stack
        cards:
          - type: picture-elements
            image: >-
              data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'
              viewBox='0 0 16 10'%3E%3C/svg%3E
            elements:
              - type: custom:macs-card
                assist_satellite_enabled: false
                assist_satellite_custom: false
                assist_pipeline_enabled: true
                assist_pipeline_entity: 01jgpf5ftshrwkbass16mzn8ks
                assist_pipeline_custom: false
                temperature_sensor_enabled: true
                temperature_sensor_entity: sensor.condrieu_temperature_2
                temperature_sensor_custom: false
                temperature_sensor_unit: c
                wind_sensor_enabled: false
                wind_sensor_custom: false
                precipitation_sensor_enabled: true
                precipitation_sensor_entity: sensor.condrieu_daily_precipitation
                precipitation_sensor_custom: false
                precipitation_sensor_unit: mm
                weather_conditions_enabled: true
                weather_conditions_entity: weather.condrieu
                weather_conditions_custom: false
                battery_charge_sensor_enabled: true
                battery_charge_sensor_entity: sensor.kiosk_browser_battery
                battery_charge_sensor_custom: true
                battery_charge_sensor_unit: '%'
                battery_state_sensor_enabled: true
                battery_state_sensor_entity: binary_sensor.kiosk_browser_charging
                battery_state_sensor_custom: true
                auto_brightness_enabled: false
                auto_brightness_min: 0
                auto_brightness_max: 100
                auto_brightness_timeout_minutes: 5
                auto_brightness_pause_animations: true
                style:
                  top: 50%
                  left: 50%
                  width: 100%
                  transform: translate(-50%, -50%)
                card_mod:
                  style: |
                    ha-card {
                      background: #000;
                    }
              - type: image
                image: /local/images/dashboard-button-trans.gif
                style:
                  bottom: 1%
                  left: 51%
                  transform: translateX(-50%)
                tap_action:
                  action: perform-action
                  perform_action: fully_kiosk.load_url
                  target: {}
                  data:
                    device_id: 372af66ff1ab975913c6efc805c29a9c
                    url: javascript:fully.focusTabByIndex(1);
            card_mod:
              style: |
                ha-card {
                  margin: 0px !important;
                  padding: 0% !important;
                  width: 100% !important;
                  height: 100% !important;
                  background: #000;
                }
          - type: conditional
            conditions:
              - condition: user
                users: []
            card:
              type: picture-entity
              entity: camera.kiosk_2
              camera_image: camera.kiosk_2
              show_state: false
              show_name: false
              fit_mode: fill
              camera_view: live
              aspect_ratio: '4:3'
              style: null
              tap_action:
                action: none
              card_mod:
                style:
                  .: |
                    @keyframes fadeIn {
                      0% {
                        opacity: 0; transform: translate(10%, 10%);
                      }
                      100% {
                        opacity: 1; transform: translate(0%);
                      }
                    }
                    @keyframes fadeOut {
                      0% {
                        opacity: 1; transform: translate(0%);
                      }
                      100% {
                        opacity: 0; transform: translate(10%, 10%);
                      }
                    }
                    :host {
                      --camera-animation-name: {{ 'fadeIn' if is_state('binary_sensor.kiosk', 'on') else 'fadeOut' }};
                      position: absolute;
                      overflow: hidden;
                      bottom: 4%;
                      right: 1.5%;
                      width: 20%;
                      border-radius: 10%;
                      border: 4px solid rgba(0, 255, 255, 0.5);
                      box-shadow: 0px 0px 15px rgba(0, 255, 255, 0.3);
                      transform: translateX(0%);
                      animation-name: var(--camera-animation-name);
                      animation-duration: 0.8s;
                      animation-fill-mode: forwards;
                      animation-timing-function: ease-out;
                    }
                  hui-image$: |
                    @keyframes scanline {
                      from { background-position: 0 0; }
                      to { background-position: 0 100%; }
                    }
                    div::after {
                      content: '';
                      position: absolute;
                      top: 0;
                      left: 0;
                      right: 0;
                      bottom: 0;
                      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%), 
                                  linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
                      background-size: 100% 15px, 100% 100%;
                      animation: scanline 10s linear infinite;
                      pointer-events: none;
                    }
          - type: horizontal-stack
            cards:
              - type: clock
                clock_size: medium
                show_seconds: true
                grid_options:
                  columns: 6
                  rows: 1
                card_mod:
                  style: >
                    ha-card {
                      float: right;
                      margin-right: -29px
                    }

                    ha-card > .time-wrapper.size-medium {
                      height: auto;
                      padding: 0;
                    }

                    ha-card > .time-wrapper.size-medium .time-parts {
                      font-size: 4rem;
                    }

                    ha-card > .time-wrapper.size-medium .time-parts
                    .time-part.am-pm, ha-card > .time-wrapper.size-medium
                    .time-parts .time-part.second {
                      font-size: 22px;
                      margin-left: 8px;
                    }
              - type: custom:button-card
                layout: icon_name_state2nd
                size: 24px
                show_icon: false
                show_name: false
                show_state: false
                styles:
                  card:
                    - padding: 0
                    - background: transparent
                  grid:
                    - grid-template-areas: '''date'''
                    - grid-template-columns: auto
                    - grid-template-rows: auto
                  custom_fields:
                    date:
                      - justify-self: start
                      - align-self: end
                      - margin-top: 14px
                      - margin-left: 0
                      - margin-right: 15px
                      - font-size: 20px
                custom_fields:
                  date: |-
                    [[[
                      let now = new Date();
                      let month = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
                      return now.getDate() + ' ' + month[now.getMonth()] + ' ' + now.getFullYear();
                    ]]]
            grid_options:
              columns: full
            card_mod:
              style: |
                :host {
                  position: absolute;
                  top: 1.5%;
                  left: 0.5%;
                }
          - cycle_interval: 10
            show_when_clear: false
            clear_message: ''
            clear_theme: success
            alerts:
              - state: unavailable
                message: Une ou plusieurs caméras sont indisponibles
                priority: 1
                theme: notification
                icon: mdi:cctv
                entity_filter: argus
                entity_filter_exclude:
                  - binary_sensor.argus_4_mouvement
