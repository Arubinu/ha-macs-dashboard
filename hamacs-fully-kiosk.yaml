              - entity: sensor.nous_d4z_power_a
                name: Variation
                statistic: max
                period: 5minute
                line:
                  width: 0
                show_value: false
                legendgroup: conso
              - entity: sensor.nous_d4z_power_a
                name: Min
                statistic: min
                period: 5minute
                line:
                  width: 0
                fill: tonexty
                fillcolor: rgba(140, 245, 255, 0.25)
                show_value: false
                legendgroup: conso
              - entity: sensor.nous_d4z_power_a
                name: Consommation
                statistic: mean
                period: 5minute
                line:
                  width: 2
                  color: rgba(140, 245, 255, .8)
                  shape: spline
                filters:
                  - map_y: Math.round(y)
                show_value: true
              - entity: sun.sun
                name: Soleil
                yaxis: y2
                time_offset: 24h
                filters:
                  - fn: |
                      ({ xs, ys }) => {
                        const dayInMs = 24 * 60 * 60 * 1000;
                        const newXs = [];
                        const newYs = [];

                        for (let i = 0; i < xs.length; i++) {
                          newXs.push(new Date(xs[i]));
                          newYs.push(ys[i] === 'above_horizon' || ys[i] === 1 ? 1 : 0);
                        }

                        for (let i = 0; i < xs.length; i++) {
                          newXs.push(new Date(xs[i].getTime() + dayInMs));
                          newYs.push(ys[i] === 'above_horizon' || ys[i] === 1 ? 1 : 0);
                        }

                        return { xs: newXs, ys: newYs };
                      }
                  - resample: 4h
                line:
                  shape: spline
                  width: 2
                  color: rgba(255, 255, 255, 0.25)
                fill: tozeroy
                fillcolor: rgba(255, 255, 255, 0.1)
