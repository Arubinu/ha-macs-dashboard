binary_sensor:
  - name: "Alvin: Maison"
    device_class: presence
    state: "{{ is_state('device_tracker.alvin_telephone', 'home') }}"
    attributes:
      data: >
        {% set sensor = 'device_tracker.alvin_telephone' %}
        {% if is_state(sensor, 'home') %}
          0
        {% else %}
          {{ distance(sensor) | round() }}
        {% endif %}
    delay_on:
      minutes: 2
    delay_off:
      minutes: 2

sensor:
  - name: "Zones Icon"
    unique_id: zones_icon
    state: "{{ states.zone | count }}"
    attributes:
      data: >
        {% set ns = namespace(zones={}) %}
        {% for s in states.zone %}
          {% set name = s.attributes.friendly_name %}
          {% set icon = s.attributes.icon | default('mdi:map-marker') %}
          {% set ns.zones = dict(ns.zones, **{name: icon}) %}
        {% endfor %}
        {{ ns.zones | to_json }}

  - name: "Alertes Météo: Jaune"
    icon: "mdi:weather-cloudy-alert"
    state: >
      {%- set attr = states['sensor.69_weather_alert'].attributes %}
      {{- attr.items() | selectattr('0', 'match', '^[A-Z]') | selectattr('1', 'eq', 'Jaune') | list | count }}
    attributes:
      array: >
        {%- set attr = states['sensor.69_weather_alert'].attributes %}
        {{- attr.items() | selectattr('0', 'match', '^[A-Z]') | selectattr('1', 'eq', 'Jaune') | map(attribute=0) | list }}
      names: >
        {%- set attr = states['sensor.69_weather_alert'].attributes %}
        {{- attr.items() | selectattr('0', 'match', '^[A-Z]') | selectattr('1', 'eq', 'Jaune') | map(attribute=0) | list | join(', ') }}

