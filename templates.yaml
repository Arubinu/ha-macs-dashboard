  - name: "Meilleur Prix (Gazole)"
    unit_of_measurement: "EUR"
    state_class: measurement
    state: >
      {% set value = states.sensor | selectattr('entity_id', 'contains', '_gazole') | rejectattr('entity_id', 'eq', 'sensor.meilleur_prix_gazole')
        | map(attribute='state') | map('float', 0) | reject('equalto', 0)
        | min %}
      {{ "%.3f" | format(value) }}
    attributes:
      name: >
        {% set values = states.sensor | selectattr('entity_id', 'contains', '_gazole') | rejectattr('entity_id', 'eq', 'sensor.meilleur_prix_gazole') | list %}
        {% set min_value = values | map(attribute='state') | map('float', 0) | reject('equalto', 0) | min %}
        {% set min_entity = values | selectattr('state', '==', min_value | string) | first %}
        {# min_entity.name.rsplit(' ', 1)[0] if min_entity else 'Aucune' #}
        {{ values | selectattr('state', '==', min_value | string)
          | map(attribute='name') | map('regex_replace', find='^(.*) \\S+$', replace='\\1')
          | list | join(', ') | default(None) }}
      ids: >
        {% set values = states.sensor | selectattr('entity_id', 'contains', '_gazole') | rejectattr('entity_id', 'eq', 'sensor.meilleur_prix_gazole') | list %}
        {% set min_value = values | map(attribute='state') | map('float', 0) | reject('equalto', 0) | min %}
        {% set min_entity = values | selectattr('state', '==', min_value | string) | first %}
        {{ values | selectattr('state', '==', min_value | string)
          | map(attribute='entity_id')
          | map('regex_replace', '^sensor\\.', '')
          | list | default([]) }}

